name: Browser Visit

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to visit'
        required: true
        type: string
      run_id:
        description: 'Run ID'
        required: false
        type: string
      screenshot:
        description: 'Take screenshots (true/false)'
        required: false
        default: 'false'
        type: string

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium
      
      - name: Visit URL
        run: |
          cat > visit.py << 'EOF'
          import asyncio
          import random
          import os
          from playwright.async_api import async_playwright
          
          async def main():
              url = os.environ.get("TARGET_URL", "").strip()
              run_id = os.environ.get("RUN_ID", "0")
              do_ss = os.environ.get("DO_SCREENSHOT", "false").lower() == "true"
              
              if url and not url.startswith("http://") and not url.startswith("https://"):
                  url = "https://" + url
              
              print(f"Visiting: {url}")
              print(f"Screenshot: {do_ss}")
              
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36",
                      viewport={"width": 412, "height": 915},
                      locale="en-IN",
                  )
                  page = await context.new_page()
                  
                  try:
                      await page.goto(url, wait_until="domcontentloaded", timeout=30000)
                      await asyncio.sleep(random.uniform(5, 10))
                      
                      final_url = page.url
                      title = await page.title()
                      print(f"Final URL: {final_url}")
                      print(f"Title: {title}")
                      
                      if do_ss:
                          await page.screenshot(path=f"ss_1_load_{run_id}.png")
                          print("SS 1 saved")
                          await page.mouse.wheel(0, 500)
                          await asyncio.sleep(2)
                          await page.screenshot(path=f"ss_2_scroll_{run_id}.png")
                          print("SS 2 saved")
                          await page.screenshot(path=f"ss_3_full_{run_id}.png", full_page=True)
                          print("SS 3 saved")
                      
                  except Exception as e:
                      print(f"Error: {e}")
                      if do_ss:
                          try:
                              await page.screenshot(path=f"ss_error_{run_id}.png")
                          except Exception:
                              pass
                  finally:
                      await browser.close()
          
          asyncio.run(main())
          EOF
          python visit.py
        env:
          TARGET_URL: ${{ inputs.url }}
          RUN_ID: ${{ inputs.run_id }}
          DO_SCREENSHOT: ${{ inputs.screenshot }}
      
      - name: Upload Screenshots
        if: ${{ inputs.screenshot == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ inputs.run_id }}
          path: ss_*.png
          retention-days: 7
